[package]
name = "backroom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "backroom"
path = "src/lib.rs"

[[bin]]
name = "backroom"
path = "src/main.rs"

# Headless test client used to check voice end to end.
[[bin]]
name = "backroom-bot"
path = "src/bin/bot.rs"

[dependencies]
proto = { workspace = true, features = ["updates"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
futures-util.workspace = true
chrono.workspace = true
memory-stats.workspace = true
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "x11"] }
cpal = "0.16"
opus = "0.3"
nnnoiseless = { version = "0.5", default-features = false }
parking_lot = "0.12"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }
