# Pushing a tag like v0.2.1 builds the Windows programs and publishes them as a
# GitHub Release. Running copies of Backroom check for the newest release and
# tell people an update is available.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($version)."
            exit 1
          fi

      - name: Install the Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 cmake

      - name: Add the Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build backroom.exe and backroom-server.exe
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          # Static C runtime, so the programs need no extra DLLs.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: -C link-arg=-static -C link-arg=-static-libgcc
        run: cargo build --release --target x86_64-pc-windows-gnu -p backroom-server --bin backroom-server -p backroom --bin backroom

      - name: Package
        run: |
          mkdir -p dist/Backroom
          cp target/x86_64-pc-windows-gnu/release/backroom.exe target/x86_64-pc-windows-gnu/release/backroom-server.exe dist/Backroom/
          sed 's/$/\r/' README.md > dist/Backroom/README.txt
          cd dist && zip -r "Backroom-$GITHUB_REF_NAME-windows.zip" Backroom

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Bug fixes and improvements." > notes.md; fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Backroom-$GITHUB_REF_NAME-windows.zip" \
            --title "Backroom ${GITHUB_REF_NAME#v}" --notes-file notes.md
